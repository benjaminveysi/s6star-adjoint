[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s6-star-splitting"
version = "1.1.0"
description = "Generic Sixth-Order Commutator-Corrected Splitting Framework"
readme = "README.md"
authors = [{ name = "Benjamin Veysi", email = "matteolind2024@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
    "torch>=2.0.0",
]
